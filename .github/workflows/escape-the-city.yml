name: Deploy De Moerasdraak to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'de-moerasdraak/**'
      - 'index.html'
      - '.github/workflows/escape-the-city.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    defaults:
      run:
        working-directory: de-moerasdraak
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: de-moerasdraak/.nvmrc
          cache: npm
          cache-dependency-path: de-moerasdraak/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          VITE_PUBLIC_BASE_URL: ${{ steps.pages.outputs.base_path }}/de-moerasdraak/
      - name: Assemble the Pages site
        run: |
          mkdir -p ../_site/de-moerasdraak
          cp ../index.html ../_site/index.html
          cp -R dist/. ../_site/de-moerasdraak/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
